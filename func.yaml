# $schema: https://raw.githubusercontent.com/knative/func/3804dc9b/schema/func_yaml-schema.json
# yaml-language-server: $schema=https://raw.githubusercontent.com/knative/func/3804dc9b/schema/func_yaml-schema.json
specVersion: 0.36.0
name: interclub-parser
runtime: python
registry: docker.io/jeremyalbrecht
image: docker.io/jeremyalbrecht/interclub-parser:latest
namespace: augny-badminton
created: 2026-08-12T00:00:00.000000+02:00
build:
  builderImages:
    host: ghcr.io/knative/builder-jammy-base:latest
    pack: ghcr.io/knative/builder-jammy-base:latest
  builder: pack
run:
  envs:
  - name: BASE_URL
    value: '{{ env:BASE_URL }}'
  - name: API_URL
    value: '{{ env:API_URL }}'
  - name: API_TOKEN
    value: '{{ env:API_TOKEN }}'
  - name: GITHUB_DISPATCH_TOKEN
    value: '{{ env:GITHUB_DISPATCH_TOKEN }}'
deploy:
  namespace: augny-badminton
  image: docker.io/jeremyalbrecht/interclub-parser:latest
  options:
    scale:
      min: 0
      max: 1
